name: idea_dump

services:
  app:
    container_name: idea_dump_app
    image: ghcr.io/${REGISTRY_OWNER:-gopal-chhetri}/idea_dump:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - PORT=${PORT:-7501}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - SCORE_WEIGHT_FIT=${SCORE_WEIGHT_FIT:-0.5}
      - SCORE_WEIGHT_EFFORT=${SCORE_WEIGHT_EFFORT:-0.3}
      - SCORE_WEIGHT_NOVELTY=${SCORE_WEIGHT_NOVELTY:-0.2}
      - IDEA_DAILY_LIMIT=${IDEA_DAILY_LIMIT:-10}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://ideas.soylab.dpdns.org/app}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      # HTTP config
      - "traefik.http.routers.idea_dump_http.entrypoints=http"
      - "traefik.http.routers.idea_dump_http.rule=Host(`${DOMAIN:-ideas.soylab.\
        dpdns.org}`)"
      # HTTPS config
      - "traefik.http.routers.idea_dump_https.entrypoints=https"
      - "traefik.http.routers.idea_dump_https.rule=Host(`${DOMAIN:-ideas.soylab\
        .dpdns.org}`)"
      - "traefik.http.routers.idea_dump_https.tls=true"
      - "traefik.http.routers.idea_dump_https.tls.certresolver=le"
      - "traefik.http.routers.idea_dump_https.service=idea_dump_service"
      # Service config
      - "traefik.http.services.idea_dump_service.loadbalancer.server.port=${POR\
        T:-7501}"
      # HTTPS redirect middleware
      - "traefik.http.routers.idea_dump_http.middlewares=https-redirect"
    networks:
      - default
      - traefik-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    container_name: idea_dump_migrate
    image: ghcr.io/${REGISTRY_OWNER:-gopal-chhetri}/idea_dump:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: idea_dump_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  redis:
    container_name: idea_dump_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

volumes:
  pgdata:
  redisdata:

networks:
  traefik-network:
    external: true
