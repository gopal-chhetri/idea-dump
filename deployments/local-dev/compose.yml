services:
  app:
    container_name: idea_dump
    tty: true
    build:
      context: ../..
      dockerfile: deployments/local-dev/Dockerfile
    ports:
      - '3000:3000'
    env_file: ./.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      # Mount source for hot-reload (exclude node_modules to keep container deps)
      - ../../src:/app/src
      - ../../app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    container_name: idea_dump_postgres
    image: postgres:16-alpine
    env_file: ./.env
    environment:
      POSTGRES_DB: ${DB_NAME:-idea_prioritizer}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    container_name: idea_dump_redis
    image: redis:7-alpine
    env_file: ./.env
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
